<!DOCTYPE html>
<meta charset="UTF-8">
<html>

<head>
  <style>
    canvas {
      border: 1px solid #d3d3d3;
      background-color: #f1f1f1;
    }
  </style>
</head>

<body onload="gameContext.start()">
  <script>
    const width = 1000;
    const height = width / 2;
    const paddleMargin = 10;
    const paddleWidth = 20;
    const paddleHeight = 100;
    const paddleHalfHeight = paddleHeight / 2;
    const stateMultipler = 5;

    const gameContext = {
      canvas: document.createElement("canvas"),
      start: function () {
        this.canvas.width = width;
        this.canvas.height = height;
        this.context = this.canvas.getContext("2d");
        document.body.insertBefore(this.canvas, document.body.childNodes[0]);
      },
      clear: function () {
        this.context.clearRect(0, 0, this.canvas.width, this.canvas.height);
      }
    }

    const connection = new WebSocket('ws://127.0.0.1:8100');
    connection.onmessage = (e) => {
      gameContext.clear();

      console.log(e.data);
      const state = JSON.parse(e.data); // {left: number, right: number, role: PlayerRole}

      context = gameContext.context;
      context.fillStyle = "red";

      context.fillRect(
        paddleMargin,
        state.left * stateMultipler - paddleHalfHeight,
        paddleWidth,
        paddleHeight
      );
      context.fillRect(
        width - paddleMargin - paddleWidth,
        state.right * stateMultipler - paddleHalfHeight,
        paddleWidth,
        paddleHeight
      );

      // Re-render with new state
      //state.forEach( e => {
      for (var i = 0; i < state.length; i++) {
        let e = state[i];
        console.log(e.position);
        ctx = gameContext.context;
        ctx.fillStyle = "red";
        ctx.fillRect(10, e.position + 50, 20, 100);
      }
    }

    document.addEventListener('keydown', function (event) {
      if (event.keyCode == 38)
        connection.send("up");
      else if (event.keyCode == 40)
        connection.send("down");
    });
  </script>
</body>

</html>
